name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml==6.0.2
      - run: python3 scripts/validate.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sha256sum android.yaml > android.yaml.sha256
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" android.yaml android.yaml.sha256 --title "$GITHUB_REF_NAME" --notes-file <(awk -v v="## $GITHUB_REF_NAME" '$0 == v {f = 1; next} /^## / {f = 0} f' CHANGELOG.md)
